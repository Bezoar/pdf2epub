# The real-world smoke set (TST-R9, TST-R12): fetched, hash-checked and converted by
# scripts/smoke.py in the manual smoke workflow. None of these files is committed (TST-R8).
#
# Fields of each [[entries]] table:
#   id, role, file          what the entry is (TST-R12's table)
#   url, sha256             where to fetch it and its pinned SHA-256; a derived entry has
#                           `derived` instead: `from` names the source entry and `fraction`
#                           the share of its bytes kept, from the start
#   license                 the file's licence
#   password                the test password published with the file (absent if none)
#   expect                  the expected conversion in the one batch run: `outcome`, the
#                           `issues` that must be reported (`code` or `code:reason`) and,
#                           with `ocr = true`, that the conversion ran OCR. A list of
#                           tables means any one of them may match.
#   expect_without_password the issue a second run without the password must report
#   must_trust              true if no page of the file may have its text layer rejected
#                           (TST-R4: born-digital pages, and the IA layers of S7 and S9;
#                           not S6 or S12, whose text is Lorem Ipsum filler)
#   check_by_eye            what the owner checks by hand in the v1 acceptance ticket

[[entries]]
id = "S1"
role = "Novel, born-digital"
file = "Little Brother, Cory Doctorow (134 pp)"
url = "https://craphound.com/littlebrother/Cory_Doctorow_-_Little_Brother.pdf"
sha256 = "f90e8dfe9778a6859a817a598c557c8c9963ac75a49ca2d7987ca386ad8f3700"
license = "CC BY-NC-SA 3.0 (fetch only)"
expect = { outcome = "converted" }
must_trust = true
check_by_eye = "chapter TOC; no running headers (Cory Doctorow/Little Brother/NN) or page numbers in text"

