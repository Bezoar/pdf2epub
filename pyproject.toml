[project]
name = "pdf2epub"
version = "0.0.0"
description = "Convert PDF books, born-digital or scanned, into reflowable EPUB 3 books."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Welch" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pdfminer-six>=20260107",
    "pillow>=12.3.0",
    "pypdf>=6.20.1",
    "pypdfium2>=5.14.0",
]

[project.scripts]
pdf2epub = "pdf2epub.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2epub"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Code blocks in the specs are illustrative, not code to lint or format.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["pypdfium2", "pypdfium2.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/conftest.py blocks outbound network for the whole suite (MAIN-AC1).
addopts = ["--strict-markers"]
markers = [
    "ac(id, ...): the acceptance criteria (spec AC IDs) this test verifies",
    "tesseract: needs the real Tesseract binary",
]

[tool.coverage.run]
branch = true
source = ["pdf2epub"]
# Also measure the CLI when tests run it as a subprocess.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "hatchling>=1.32.4",
    "hypothesis>=6.169.1",
    "jsonschema>=4.26.0",
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.0",
    "packaging>=26.3",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "ruff>=0.17.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]
